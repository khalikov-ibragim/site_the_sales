name: CI
on:
  push:
    branches: [main]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Copy my repository
        uses: actions/checkout@v4

      - name: install linters and kubeconform
        run: |
          sudo apt-get update
          sudo apt-get install -y yamllint shellcheck
          wget -qO /tmp/hadolint https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          sudo mv /tmp/hadolint /usr/local/bin/hadolint
          sudo chmod +x /usr/local/bin/hadolint
          wget -qO /tmp/kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.4/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          sudo mv /tmp/kubeconform /usr/local/bin/kubeconform
          sudo chmod +x /usr/local/bin/kubeconform

      - name: lint compose
        run: yamllint -d relaxed docker-compose*.y*ml

      - name: lint dockerfiles
        run: find . -iname "Dockerfile*" -not -path "./node_modules/*" -print0 | xargs -0 -I{} hadolint {}

      - name: lint shell scripts
        run: find . -name "*.sh" -print0 | xargs -0 -I{} shellcheck -P ../../ {}

      - name: lint kubernetes manifests
        run: kubeconform -strict -summary k3s/
  test:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Run my repository
        uses: actions/checkout@v4

      - name: Copy my secrets
        run: cp .env.example .env

        #Building my container
      - name: build container
        run: docker compose build

        # Run my container
      - name: run the container
        run: docker compose up -d

        # checking work the container
      - name: check the container
        run: docker compose ps -a

        # show backend logs
      - name: show backend logs
        run: docker compose logs back

        # health check backend
      - name: wait for backend
        run: |
          for i in $(seq 1 30); do
          if curl -f http://localhost:8000/health; then
          echo "backend ready"
            exit 0
          fi
          echo "waiting... attempt $i"
          sleep 2
          done
          echo "backend did not start in time"
          exit 1
      #test backend
      - name: test api
        run: docker compose exec -T back python test_api.py | tee test-report.txt #tee- пишет вывод и в терминал и в файл test-report.txt
      - uses: actions/upload-artifact@v4 #сохраняем его в артефактах
        with:
          name: test-results #даем ему название
          path: test-report.txt #даем ему путь
      - name: Login to docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      # TAG THE IMAGE
      - name: build and push backend
        run: |
          docker tag site_the_sales-back glimpl/site_the_sales-back:latest
          docker push glimpl/site_the_sales-back:latest
          docker tag glimpl/site_the_sales-back:latest glimpl/site_the_sales-back:${GITHUB_SHA::7}  
          docker push glimpl/site_the_sales-back:${GITHUB_SHA::7}
      - name: build and push frontend
        run: |
          docker tag site_the_sales-front glimpl/site_the_sales-front:latest
          docker push glimpl/site_the_sales-front:latest
          docker tag glimpl/site_the_sales-front:latest glimpl/site_the_sales-front:${GITHUB_SHA::7}  
          docker push glimpl/site_the_sales-front:${GITHUB_SHA::7}
  deploy:
    runs-on: self-hosted
    needs: [test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28.0'

      - name: Deploy to k3s cluster
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          echo "$KUBECONFIG_DATA" > /tmp/kubeconfig.yaml
          export KUBECONFIG=/tmp/kubeconfig.yaml
          kubectl cluster-info

          # Применяем все манифесты кластера
          kubectl apply -f k3s/

          # Удаляем старый job миграций если есть, чтобы запустить заново
          kubectl -n site-the-sales delete job db-migrate --ignore-not-found=true

          # Создаём job из шаблона и ждём его завершения
          kubectl -n site-the-sales create job db-migrate-${GITHUB_SHA::7} --from=job/db-migrate
          kubectl -n site-the-sales wait --for=condition=complete job/db-migrate-${GITHUB_SHA::7} --timeout=300s

          # Обновляем образы в деплоях
          kubectl -n site-the-sales set image deployment/frontend frontend=glimpl/site_the_sales-front:${GITHUB_SHA::7}
          kubectl -n site-the-sales set image deployment/backend backend=glimpl/site_the_sales-back:${GITHUB_SHA::7}

          # Ждём выката 
          kubectl -n site-the-sales rollout status deployment/frontend --timeout=120s
          kubectl -n site-the-sales rollout status deployment/backend --timeout=120s

          # Удаляем job миграций после успешного завершения
          kubectl -n site-the-sales delete job db-migrate-${GITHUB_SHA::7} --ignore-not-found=true