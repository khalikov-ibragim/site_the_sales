name: CI
on:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Run my repository
        uses: actions/checkout@v4

        #Building my container
      - name: build container
        run: docker compose build

        # Run my container
      - name: run the container
        run: docker compose up -d

        # checking work the container
      - name: check the container
        run: docker compose ps -a

        # show backend logs
      - name: show backend logs
        run: docker compose logs back

        # health check backend
      - name: wait for backend
        run: |
          for i in $(seq 1 30); do
          if curl -f http://localhost:8000/health; then
          echo "backend ready"
            exit 0
          fi
          echo "waiting... attempt $i"
          sleep 2
          done
          echo "backend did not start in time"
          exit 1
        # health check bd
      - name: check bd
        run: docker compose exec database pg_isready -U admin

      #test backend
      - name: test product endpoint
        run: curl -f http://localhost:8000/api/products

