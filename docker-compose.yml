services:
  front:
    build: ./frontend
    container_name: frontend
    ports:
      - "1234:80"
    restart: always
    depends_on:
      - back

  back:
    build: ./backend
    container_name: backend
    ports:
      - "8000:8000"
    depends_on:
      - database
    restart: always
    environment:
      DB_HOST: database
      DB_USER: admin
      DB_PORT: 5432
      DB_PASSWORD: myadmin
      DB_NAME: mybase
      SECRET_KEY: change-me-in-prod-12345

  database:
    image: docker.io/postgres:17-alpine
    container_name: database
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_DB: mybase
      POSTGRES_PASSWORD: myadmin
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro,Z

  pgadmin:
    image: docker.io/dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: myadmin@example.com
      PGADMIN_DEFAULT_PASSWORD: myadmin
    ports:
      - "5678:80"
    depends_on:
      - database
    restart: always
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  pgadmin_data:
  postgres_data: